name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisa el diff de este pull request. Este repo distribuye configuración de
            Claude Code (agentes, reglas, skills) para un stack Symfony 6.4/8 · PHP 8.3/8.4
            · Twig · JavaScript — no es una aplicación en ejecución, así que evalúa el
            contenido como documentación/instrucciones, no como código que compila.

            Verifica:
            - Coherencia con CLAUDE.md y rules/php/symfony.md (versiones Symfony 6.4 vs 8.x,
              PHP 8.3 vs 8.4, atributos vs anotaciones, Doctrine, seguridad).
            - Que no se reintroduzcan referencias a stacks fuera de alcance (AWS, LangChain,
              Terraform, etc.) — este repo es exclusivamente PHP/Symfony.
            - Rutas de archivo e instrucciones de instalación del README siguen siendo válidas
              si el PR cambia la estructura de agents/, rules/ o skills/.
            - Que no haya secretos, API keys o credenciales hardcodeadas en ningún archivo.

            Publica los hallazgos como comentario de review en el PR, ordenados por
            severidad. Si no hay hallazgos, dilo explícitamente en un comentario breve.

  respond-to-mentions:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude respond
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
